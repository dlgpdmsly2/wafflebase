# Offline replay eval harness — manual runs in a clean CI environment.
#
# Why CI: a GitHub runner is a clean, reproducible box (no dev-laptop state, no
# local credential drift) and keeps the model spend + artifacts off the laptop.
# Runs are manual (workflow_dispatch) because each spends real model budget.
#
# Results are BOTH (a) pushed to the public results repo dlgpdmsly2/wafflebase-agent-eval
# (when push_results is on) AND (b) uploaded as a downloadable artifact (always, a
# backup that survives even if the push is misconfigured).
#
# Three modes (pick with the `mode` input; a dispatch runs exactly one):
#   reliability  — whole-panel: K replicate panel runs → verdict flip-rate + κ.
#   stage-pilot  — Mode A: capture ONE item once, then replay each STAGE
#                  (gate/verifier/detection) K times → per-stage flip-rate/κ/overlap.
#                  Verifier fidelity needs repo context (it Greps the tree); if the
#                  PR commits aren't fetchable in the fork CI it falls back to
#                  diff-only, which makes the verifier metric low-fidelity — see the
#                  no_repo_context note.
#                  With stage_detection_only it narrows to DETECTION alone and adds
#                  the sample-count study — "is the 2nd detection sample worth its
#                  cost?" — scored by sample-count-analysis.mjs. Each replay at
#                  samples:2 yields TWO independent single-sample draws, so K
#                  replicates give 2K draws to resample the curve from.
#   validity     — VALIDITY (is the panel right?), the counterpart to reliability's
#                  (is it stable?). Lightweight + MODEL-FREE: no extract, no panel
#                  run, no capture — it only re-scores stage fixtures a prior
#                  stage-pilot already produced AGAINST ground-truth labels, so it
#                  costs a runner-minute and zero model budget. Reads two things from
#                  the eval repo, keyed by corpus_version:
#                    - stage-fixtures/<corpus_version>__stagepilot/  (from stage-pilot)
#                    - labels/<corpus_version>/findings/…            (the labeled
#                      dataset — finding-level is_real, human-committed). THAT labels/
#                      tree IS the dataset: feed new labels by committing them there.
#                  Runs verifier-validity.mjs → keep/drop × real/fake confusion matrix.
#
# One-time setup — two repo secrets on THIS repo (the wafflebase fork, where the
# workflow runs):
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (or an sk-ant-api03 API key)
#   EVAL_REPO_TOKEN          a PAT with Contents:read/write on wafflebase-agent-eval
#                            (the built-in GITHUB_TOKEN is scoped to THIS repo only
#                            and cannot push to the separate results repo). Set it:
#                              gh secret set EVAL_REPO_TOKEN -R dlgpdmsly2/wafflebase
name: agent-eval

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "reliability (whole-panel) | stage-pilot (Mode A stage isolation) | validity (model-free re-score vs labels)"
        default: "reliability"
      corpus_version:
        description: "corpus version (rebuilt fresh from the PRs below)"
        default: "2026-07-28-pilot"
      prs:
        description: "comma-separated PR numbers for the corpus"
        default: "549,548,547,546,544,521,513,556,536,533,532,531,523,520,514,507,505,502,493,471"
      runs:
        description: "K — replicate runs (reliability κ needs ≥2; use 1 for a verdict probe)"
        default: "1"
      config_id:
        description: "judge config id (label only)"
        default: "baseline-opus5-s2"
      stage_pr:
        description: "stage-pilot only: PR number to capture ONE item from (pick one that raises a blocking finding, e.g. 521)"
        default: "521"
      stage_k:
        description: "stage-pilot only: K stage replicates per stage (≥2 for flip-rate/κ)"
        default: "2"
      stage_max_verifier:
        description: "stage-pilot only: cap verifier fixtures/item (bounds the O(findings)×K replay cost; 0 = uncapped)"
        default: "8"
      stage_include_detection:
        description: "stage-pilot only: also replay DETECTION (re-runs the FULL 5-lens panel per K — the pilot's biggest cost, ~$12/K). false = gate+verifier only (cheap, session-safe)"
        default: "false"
      stage_detection_only:
        description: "stage-pilot only: replay ONLY detection and score the sample-count study (skips gate+verifier entirely). Overrides stage_include_detection. Use K>=3"
        default: "false"
      no_repo_context:
        description: "true = diff-only replay (skip repo checkout)"
        default: "false"
      push_results:
        description: "true = commit+push results to the eval repo (needs EVAL_REPO_TOKEN)"
        default: "true"

jobs:
  eval:
    # Match `reliability` EXPLICITLY, not "anything that isn't stage-pilot". With a
    # third mode in play, the old negative guard let `mode: validity` start this job
    # too — a whole-panel run charging real model budget behind a mode documented as
    # costing $0. A mistyped mode now runs nothing, which is the safe failure.
    if: ${{ inputs.mode == 'reliability' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Results land directly inside a checkout of the eval repo, so a run is
      # committed in place and re-runs resume against existing artifacts.
      RESULTS_DIR: ${{ github.workspace }}/eval-results
    steps:
      - uses: actions/checkout@v4

      # The results repo — checked out into ./eval-results with a token that can
      # push back to it. persist-credentials (default true) keeps that auth for
      # the later push. Skipped when push_results=false (artifact-only run).
      - name: Checkout eval results repo
        if: ${{ inputs.push_results != 'false' }}
        uses: actions/checkout@v4
        with:
          repository: dlgpdmsly2/wafflebase-agent-eval
          token: ${{ secrets.EVAL_REPO_TOKEN }}
          path: eval-results
          fetch-depth: 0

      - name: Ensure results dir exists
        run: mkdir -p "$RESULTS_DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install agent-scripts deps (SDK)
        working-directory: scripts/agent
        run: npm ci

      - name: Extract corpus (fetches PR commits → real repo context)
        working-directory: scripts/agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node eval/extract-corpus.mjs --out "$RESULTS_DIR" \
            --corpus-version "${{ inputs.corpus_version }}" --prs "${{ inputs.prs }}"

      - name: Run K replicate(s)
        working-directory: scripts/agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ "${{ inputs.no_repo_context }}" = "true" ] && FLAG="--no-repo-context" || FLAG=""
          for i in $(seq 1 "${{ inputs.runs }}"); do
            echo "::group::run $i / ${{ inputs.runs }}"
            node eval/run.mjs --out "$RESULTS_DIR" \
              --corpus-version "${{ inputs.corpus_version }}" \
              --config-id "${{ inputs.config_id }}" $FLAG | tee "run-$i.log"
            echo "::endgroup::"
          done
          grep -o 'config_hash=[^ ]*' run-1.log | head -1 | cut -d= -f2 > "$RUNNER_TEMP/config_hash"

      - name: Score reliability (K ≥ 2)
        if: ${{ inputs.runs != '1' }}
        working-directory: scripts/agent
        run: |
          HASH=$(cat "$RUNNER_TEMP/config_hash")
          node eval/reliability.mjs --out "$RESULTS_DIR" \
            --config-hash "$HASH" --corpus-version "${{ inputs.corpus_version }}"

      - name: Drop raw transcripts (bulky; verdicts live in payload.json)
        run: find "$RESULTS_DIR/runs" -name 'transcript.json.gz' -delete || true

      # Commit whatever changed (new/updated corpus + run + scores). The eval
      # repo's .gitignore already excludes transcripts, so add -A won't stage them.
      - name: Commit & push results to eval repo
        if: ${{ inputs.push_results != 'false' }}
        working-directory: ${{ github.workspace }}/eval-results
        run: |
          git config user.name  "wafflebase-eval-bot"
          git config user.email "wafflebase-eval-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"; exit 0
          fi
          git commit -m "eval: ${{ inputs.corpus_version }} K${{ inputs.runs }} — ${{ inputs.config_id }} (run ${{ github.run_id }})"
          git push origin HEAD:main

      - name: Upload results (backup artifact)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.corpus_version }}-K${{ inputs.runs }}
          path: ${{ env.RESULTS_DIR }}
          retention-days: 30

  # Mode A — stage-isolated reliability. Capture ONE item once (a real panel run),
  # harvest its frozen per-stage fixtures (offline), then replay each stage K times
  # and score per-stage flip-rate/κ (gate/verifier) and overlap (detection). Only
  # the capture is panel-scale; the gate replay is free, verifier replays are cheap.
  stage-pilot:
    if: ${{ inputs.mode == 'stage-pilot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RESULTS_DIR: ${{ github.workspace }}/eval-results
      # Explicit fixture-corpus name, passed to every stage step so nothing is parsed.
      SV: ${{ inputs.corpus_version }}__stagepilot
    steps:
      - uses: actions/checkout@v4

      - name: Checkout eval results repo
        if: ${{ inputs.push_results != 'false' }}
        uses: actions/checkout@v4
        with:
          repository: dlgpdmsly2/wafflebase-agent-eval
          token: ${{ secrets.EVAL_REPO_TOKEN }}
          path: eval-results
          fetch-depth: 0

      - name: Ensure results dir exists
        run: mkdir -p "$RESULTS_DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install agent-scripts deps (SDK)
        working-directory: scripts/agent
        run: npm ci

      - name: Extract corpus for the pilot item (fetches PR commits → repo context)
        working-directory: scripts/agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node eval/extract-corpus.mjs --out "$RESULTS_DIR" \
            --corpus-version "${{ inputs.corpus_version }}" --prs "${{ inputs.stage_pr }}"

      - name: Capture — one panel run emits per-stage detail
        working-directory: scripts/agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Diff-only is opt-in. Otherwise REQUIRE repo context so a failed PR-commit
          # checkout aborts BEFORE spending — a silent diff-only capture over-flags,
          # exploding the verifier fan-out and cost (the #521 pilot billed $44 this way).
          if [ "${{ inputs.no_repo_context }}" = "true" ]; then FLAG="--no-repo-context"; else FLAG="--require-repo-context"; fi
          # Namespace the capture run-id by corpus_version so a NEW corpus_version =
          # a fresh capture. A fixed "stage-capture" id collides with a prior run's
          # artifacts in the results repo, so the resume "already done, skip" reuses
          # it — silently resurrecting a stale diff-only capture and bypassing the
          # --require-repo-context guard entirely (which is exactly what happened
          # re-dispatching the #521 pilot). Everything else is already corpus-scoped.
          node eval/run.mjs --out "$RESULTS_DIR" \
            --corpus-version "${{ inputs.corpus_version }}" \
            --config-id "${{ inputs.config_id }}" \
            --items "pr-${{ inputs.stage_pr }}" --run-id "stage-capture-${{ inputs.corpus_version }}" $FLAG

      - name: Persist capture immediately (bank the spend before offline steps can fail)
        if: ${{ inputs.push_results != 'false' }}
        working-directory: ${{ github.workspace }}/eval-results
        run: |
          # The capture is the ONLY expensive step (a grounded panel run). The final
          # push runs after harvest/replay/score, so ANY failure in those offline steps
          # (e.g. a stage-schema drift throwing at harvest) skips the push and throws the
          # capture away — you re-pay on the next dispatch. Bank it to the results repo
          # the instant it succeeds; a re-dispatch with the same corpus_version then
          # resumes against it via run.mjs's "already done, skip" instead of re-capturing.
          git config user.name  "wafflebase-eval-bot"
          git config user.email "wafflebase-eval-bot@users.noreply.github.com"
          # Drop bulky raw transcripts now (harvest reads payload.json, not these) so the
          # banked commit stays lean, same as the final step does.
          find "$RESULTS_DIR/runs" -name 'transcript.json.gz' -delete || true
          git add -A
          if git diff --cached --quiet; then
            echo "no capture changes to persist"; exit 0
          fi
          git commit -m "stage-pilot capture: $SV pr-${{ inputs.stage_pr }} (run ${{ github.run_id }})"
          # Best-effort: a push race must NOT abort the run — the capture is already in the
          # working tree, and the final push will carry it. Never regresses today's behaviour.
          git push origin HEAD:main || echo "intermediate capture push failed (non-fatal); final push will retry"

      - name: Harvest stage fixtures (offline, no model calls)
        working-directory: scripts/agent
        run: |
          # Cap verifier fixtures/item so the K× replay cost is bounded regardless of
          # how many findings the capture raised (0 = uncapped).
          node eval/extract-stage-fixtures.mjs --out "$RESULTS_DIR" \
            --run-id "stage-capture-${{ inputs.corpus_version }}" --stage-version "$SV" \
            --max-verifier-fixtures "${{ inputs.stage_max_verifier }}"

      - name: Replay each stage K times
        working-directory: scripts/agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Verifier/detection re-establish facts from the repo checked out at the
          # review commit; gate is pure and ignores --repo-source. Diff-only starves
          # the verifier's Grep (low-fidelity), so keep repo context on when you can.
          #
          # --require-repo-context mirrors the capture's guard: unless diff-only was
          # asked for, a replay that cannot check out the tree ERRORS instead of
          # quietly billing full price for starved input. It matters most on a
          # RE-DISPATCH, where the capture is skipped as already-done and a cold
          # runner may no longer have the PR commits fetched.
          if [ "${{ inputs.no_repo_context }}" = "true" ]; then REPO="";
          else REPO="--repo-source ${{ github.workspace }} --require-repo-context"; fi
          # DETECTION replay re-runs the entire 5-lens × N-sample panel — a full review
          # per K, the pilot's dominant cost (~$12/K). Off by default so a routine pilot
          # is capture + gate + verifier (cheap, predictable, low session-limit risk);
          # opt in only when you specifically want detection reliability. gate is free
          # (pure) and verifier is capped, so those always run.
          #
          # stage_detection_only narrows that to detection ALONE — the sample-count
          # study (is the 2nd sample worth its cost?) reads nothing but per-sample
          # detection output, so replaying gate and verifier K times would be pure
          # spend against metrics nobody reads on that dispatch.
          if [ "${{ inputs.stage_detection_only }}" = "true" ]; then STAGES="detection";
          elif [ "${{ inputs.stage_include_detection }}" = "true" ]; then STAGES="gate verifier detection";
          else STAGES="gate verifier"; fi
          echo "replaying stages: $STAGES (K=${{ inputs.stage_k }})"
          for k in $(seq 1 "${{ inputs.stage_k }}"); do
            for stage in $STAGES; do
              echo "::group::stage=$stage k=$k"
              node eval/stage-run.mjs --out "$RESULTS_DIR" --stage-version "$SV" \
                --stage "$stage" --run-id "${stage}-${k}" $REPO
              echo "::endgroup::"
            done
          done

      - name: Score per-stage reliability
        working-directory: scripts/agent
        run: |
          # Score only the stages actually replayed (detection is opt-in above).
          if [ "${{ inputs.stage_detection_only }}" = "true" ]; then STAGES="detection";
          elif [ "${{ inputs.stage_include_detection }}" = "true" ]; then STAGES="gate verifier detection";
          else STAGES="gate verifier"; fi
          for stage in $STAGES; do
            echo "::group::score $stage"
            node eval/stage-reliability.mjs --out "$RESULTS_DIR" --stage-version "$SV" --stage "$stage" \
              || echo "  (need ≥2 usable replicates for $stage — skipped)"
            echo "::endgroup::"
          done
          # Sample-count study — only meaningful once detection was actually replayed.
          # Model-free: it re-reads the per-sample findings those replays already wrote.
          # NOTE its detection overlap sibling above (stage-reliability) keys findings on
          # an EXACT `file::summary` string, so its mean_jaccard reads low whenever one
          # defect is reworded; this scorer matches semantically and is the one to trust
          # on detection agreement.
          case " $STAGES " in *" detection "*)
            echo "::group::score sample-count"
            node eval/sample-count-analysis.mjs --out "$RESULTS_DIR" --stage-version "$SV" \
              || echo "  (no usable detection replays — skipped)"
            echo "::endgroup::" ;;
          esac

      - name: Drop raw transcripts (bulky; verdicts live in payload.json)
        run: find "$RESULTS_DIR/runs" -name 'transcript.json.gz' -delete || true

      - name: Commit & push results to eval repo
        if: ${{ inputs.push_results != 'false' }}
        working-directory: ${{ github.workspace }}/eval-results
        run: |
          git config user.name  "wafflebase-eval-bot"
          git config user.email "wafflebase-eval-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"; exit 0
          fi
          git commit -m "stage-pilot: $SV pr-${{ inputs.stage_pr }} K${{ inputs.stage_k }} (run ${{ github.run_id }})"
          git push origin HEAD:main

      - name: Upload results (backup artifact)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage-pilot-${{ inputs.corpus_version }}-pr${{ inputs.stage_pr }}-K${{ inputs.stage_k }}
          path: ${{ env.RESULTS_DIR }}
          retention-days: 30

  # validity — lightweight, MODEL-FREE re-score of an existing stage-fixtures corpus
  # against committed ground-truth labels. No corpus extract, no panel run, no
  # capture: it reads fixtures + labels already in the eval repo and runs the
  # validity scorer(s), so a dispatch is a runner-minute and $0 of model budget.
  # Prereqs in the eval repo (both keyed by corpus_version): the stage fixtures from a
  # prior stage-pilot AND the finding-level labels a human committed under labels/.
  validity:
    if: ${{ inputs.mode == 'validity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESULTS_DIR: ${{ github.workspace }}/eval-results
      # Fixtures a stage-pilot writes are named <corpus_version>__stagepilot; score
      # that corpus. (Same derivation as stage-pilot's SV, so the two modes couple by
      # a shared corpus_version with no extra input.)
      SV: ${{ inputs.corpus_version }}__stagepilot
    steps:
      - uses: actions/checkout@v4          # the harness — the validity scorer lives here

      # The eval repo carries BOTH the fixtures to score and the labels to score
      # against, so validity MUST check it out (unconditionally — unlike the
      # generating modes, which only need it to push results back out).
      - name: Checkout eval results repo (fixtures + labels)
        uses: actions/checkout@v4
        with:
          repository: dlgpdmsly2/wafflebase-agent-eval
          token: ${{ secrets.EVAL_REPO_TOKEN }}
          path: eval-results
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `npm ci`: the validity scorers are pure Node (fs/crypto/path only, via
      # store.mjs) — no SDK, no dependencies. This is what keeps the mode lightweight.

      - name: Score verifier-stage validity (re-score; no model calls)
        working-directory: scripts/agent
        run: |
          echo "scoring stage-version=$SV corpus-version=${{ inputs.corpus_version }}"
          # Exits non-zero if the fixtures version has no verifier artifacts (wrong
          # corpus_version / no stage-pilot yet); n=0 with all findings unlabeled is a
          # clean "no-data" (labels missing or key-mismatch), reported not failed.
          node eval/verifier-validity.mjs --out "$RESULTS_DIR" \
            --stage-version "$SV" --corpus-version "${{ inputs.corpus_version }}"

      - name: Commit & push validity score to eval repo
        if: ${{ inputs.push_results != 'false' }}
        working-directory: ${{ github.workspace }}/eval-results
        run: |
          git config user.name  "wafflebase-eval-bot"
          git config user.email "wafflebase-eval-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no score changes to commit"; exit 0
          fi
          git commit -m "validity: $SV — verifier-validity (run ${{ github.run_id }})"
          # A re-score races the generating modes' pushes to main; rebase first so a
          # concurrent results push doesn't reject this idempotent score.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload validity score (backup artifact)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validity-${{ inputs.corpus_version }}
          path: ${{ env.RESULTS_DIR }}/stage-fixtures/${{ inputs.corpus_version }}__stagepilot/scores
          retention-days: 30
